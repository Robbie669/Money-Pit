<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Budget Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0c10; color: #c5c6c7; margin: 0; padding: 20px; }
        h1 { color: #66fcf1; }
        .container { max-width: 800px; margin: 0 auto; background: #1f2833; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        label { display: block; margin-top: 10px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; border-radius: 4px; border: 1px solid #45a29e; background: #0b0c10; color: #c5c6c7; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 16px; border: none; border-radius: 4px; background: #45a29e; color: #0b0c10; font-weight: 700; cursor: pointer; }
        button:hover { background: #66fcf1; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px; border-bottom: 1px solid #45a29e; text-align: left; font-size: 0.9rem; }
        th { background: #0b0c10; color: #66fcf1; }
        .summary { margin-top: 20px; padding: 10px; background: #0b0c10; border-radius: 6px; border: 1px solid #45a29e; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        .delete-btn { background: #c0392b; color: #fff; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 0.8rem; }
        .delete-btn:hover { background: #e74c3c; }
        .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 6px; display: none; }
        .empty-row td { text-align: center; color: #888; padding: 16px 8px; }
        .status-msg { font-size: 0.8rem; color: #888; margin-top: 6px; }
        .loading-msg { text-align: center; padding: 16px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Budget Tracker</h1>
        <p>Track your income and expenses daily. Data is saved to Supabase and persists across devices.</p>

        <div class="flex-row">
            <div>
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
            <div>
                <label for="type">Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
        </div>

        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. Groceries, Rent, Salary">

        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" placeholder="e.g. 25.50">

        <div class="error-msg" id="errorMsg"></div>

        <button id="addEntryBtn">Add Entry</button>
        <span class="status-msg" id="statusMsg"></span>

        <div class="summary">
            <h2>Summary</h2>
            <p><strong>Total Income:</strong> <span id="totalIncome">$0.00</span></p>
            <p><strong>Total Expenses:</strong> <span id="totalExpenses">$0.00</span></p>
            <p><strong>Net Balance:</strong> <span id="netBalance">$0.00</span></p>
        </div>

        <h2>Entries</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="entriesTableBody">
                <tr class="empty-row"><td colspan="5" class="loading-msg">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ---- Supabase config ----
        const SUPABASE_URL = 'https://xuagfcmkxsecdcugsfyf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1YWdmY21reHNlY2RjdWdzZnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzA3NTksImV4cCI6MjEwMzM0Njc1OX0.gYSWhd4guIezxMBkoRo1u3xSS9E6tXL7bMD2LF3UIiE';
        const TABLE_NAME = 'budget_entries';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let entries = [];

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        function showStatus(msg) {
            document.getElementById('statusMsg').textContent = msg;
            if (msg) setTimeout(() => { document.getElementById('statusMsg').textContent = ''; }, 2000);
        }

        async function loadEntries() {
            const { data, error } = await supabaseClient
                .from(TABLE_NAME)
                .select('*')
                .order('date', { ascending: false })
                .order('id', { ascending: false });

            if (error) {
                showError('Failed to load entries: ' + error.message);
                entries = [];
                return;
            }
            entries = data || [];
        }

        async function addEntry() {
            showError('');
            const dateValue = document.getElementById('date').value;
            const typeValue = document.getElementById('type').value;
            const categoryValue = document.getElementById('category').value.trim();
            const amountValue = document.getElementById('amount').value;

            if (!categoryValue) {
                showError('Please enter a category.');
                return;
            }
            if (!amountValue) {
                showError('Please enter an amount.');
                return;
            }

            const amountNum = parseFloat(amountValue);
            if (isNaN(amountNum) || amountNum <= 0) {
                showError('Please enter a valid positive amount.');
                return;
            }
            if (!dateValue) {
                showError('Please choose a date.');
                return;
            }

            const btn = document.getElementById('addEntryBtn');
            btn.disabled = true;

            const { data, error } = await supabaseClient
                .from(TABLE_NAME)
                .insert([{
                    date: dateValue,
                    type: typeValue,
                    category: categoryValue,
                    amount: amountNum
                }])
                .select();

            btn.disabled = false;

            if (error) {
                showError('Failed to save: ' + error.message);
                return;
            }

            document.getElementById('category').value = '';
            document.getElementById('amount').value = '';
            showStatus('Entry added');
            await loadEntries();
            render();
        }

        async function deleteEntry(id) {
            const { error } = await supabaseClient
                .from(TABLE_NAME)
                .delete()
                .eq('id', id);

            if (error) {
                showError('Failed to delete: ' + error.message);
                return;
            }
            showStatus('Entry deleted');
            await loadEntries();
            render();
        }

        function render() {
            const tbody = document.getElementById('entriesTableBody');
            tbody.innerHTML = '';

            if (entries.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No entries yet. Add one above.</td></tr>';
            }

            let totalIncome = 0;
            let totalExpenses = 0;

            entries.forEach(entry => {
                const tr = document.createElement('tr');

                const tdDate = document.createElement('td');
                tdDate.textContent = entry.date || '';
                const tdType = document.createElement('td');
                tdType.textContent = entry.type || '';
                const tdCategory = document.createElement('td');
                tdCategory.textContent = entry.category || '';
                const tdAmount = document.createElement('td');
                const amountNum = typeof entry.amount === 'number' ? entry.amount : parseFloat(entry.amount);
                tdAmount.textContent = '$' + (isNaN(amountNum) ? '0.00' : amountNum.toFixed(2));
                const tdActions = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', () => deleteEntry(entry.id));
                tdActions.appendChild(delBtn);

                tr.appendChild(tdDate);
                tr.appendChild(tdType);
                tr.appendChild(tdCategory);
                tr.appendChild(tdAmount);
                tr.appendChild(tdActions);
                tbody.appendChild(tr);

                if (entry.type === 'income') totalIncome += amountNum || 0;
                else if (entry.type === 'expense') totalExpenses += amountNum || 0;
            });

            document.getElementById('totalIncome').textContent = '$' + totalIncome.toFixed(2);
            document.getElementById('totalExpenses').textContent = '$' + totalExpenses.toFixed(2);
            document.getElementById('netBalance').textContent = '$' + (totalIncome - totalExpenses).toFixed(2);
        }

        window.addEventListener('load', async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            await loadEntries();
            render();
        });

        document.getElementById('addEntryBtn').addEventListener('click', addEntry);
    </script>
</body>
</html>
